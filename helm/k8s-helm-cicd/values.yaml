replicaCount: 2

image:
  repository: ammarkhan96/k8s-helm-cicd
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30080

resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 500m
    memory: 256Mi

probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10

  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 5
