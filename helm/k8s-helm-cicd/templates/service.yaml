apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-helm-cicd.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "k8s-helm-cicd.name" . }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      nodePort: {{ .Values.service.nodePort }}
